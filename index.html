<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>自瞄识别 · Hackathon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================
           命名规则
           块：          bar / dock / desk / win / head / crumb / side /
                        nav / search / tile / toggle / doc / toc
           块-元素：      bar-btn / dock-item / nav-item / crumb-prj
           块-元素-角色：  head-btn-close
           状态：         is-open / is-max / is-hide / is-sel / is-on / is-show
           ========================================================== */

        /* ==========================================================
           变量：取自 Yaru(Ubuntu 26.04) 源码 _palette.scss / _colors.scss
           这里只保留页面真正用到的，完整调色板见 Yaru 仓库
           ========================================================== */
        :root {
            /* 中性色 */
            --inkstone: #3D3D3D;
            --ash: #878787;
            --warm-gray: #AEA79F;
            --porcelain: #F7F7F7;

            /* 彩色 */
            --red: #C7162B;
            --orange: #E95420;
            --yellow: #F99B11;
            --green: #0E8420;

            /* 强调色，Yaru 默认就是橙色 */
            --accent: var(--orange);

            /* 间距与圆角 —— 对应 $base_padding:6 / $base_border_radius:6 / $modal_radius:12 */
            --pad: 6px;
            --pad2: 12px;
            --radius-ctl: 6px;
            --radius-item: 9px;     /* $dock_item_border_radius = base_border_radius * 1.5 */
            --radius-win: 12px;     /* $modal_radius */

            /* 顶栏和 Dock：26.04 起 Dock 不再半透明，颜色跟顶栏保持一致 */
            --bar-bg: var(--inkstone);
            --bar-fg: #F2F2F2;

            /* 动效 */
            --ease: cubic-bezier(.4, 0, .2, 1);
            --dur: 200ms;
        }

        /* 浅色模式 */
        html[data-theme=light] {
            --bg: #FAFAFA;          /* $light_bg_color */
            --base: #FFFFFF;        /* $base_color */
            --fg: var(--inkstone);  /* $fg_color */
            --fg-dim: var(--ash);
            --border: #CDCDCD;      /* darken($bg_color, 18%) */
            --border-alt: #BEBEBE;  /* darken($bg_color, 24%) */
            --head-bg: #FDFDFD;     /* lighten($bg_color, 5%) */
            --side-bg: #FCFCFC;     /* mix($bg_color, $base_color, 50%) */
            --hover: rgba(0, 0, 0, .055);
            --active: rgba(0, 0, 0, .10);
            --sel-tint: rgba(233, 84, 32, .30);   /* transparentize($accent_bg_color, .7) */
            --code-bg: #F2F2F2;
            --code-fg: #2C2C2C;
            --shadow: 0 12px 32px rgba(24, 24, 24, .22), 0 2px 6px rgba(24, 24, 24, .12);
        }

        /* 深色模式 */
        html[data-theme=dark] {
            --bg: #2C2C2C;          /* lighten($jet, 8%) */
            --base: #272727;        /* lighten($jet, 6%) */
            --fg: var(--porcelain);
            --fg-dim: var(--warm-gray);
            --border: #3A3A3A;
            --border-alt: #464646;
            --head-bg: #303030;
            --side-bg: #2A2A2A;
            --hover: rgba(255, 255, 255, .06);
            --active: rgba(255, 255, 255, .11);
            --sel-tint: rgba(233, 84, 32, .20);   /* transparentize($accent_bg_color, .8) */
            --code-bg: #1F1F1F;
            --code-fg: #E8E8E8;
            --shadow: 0 14px 40px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .4);
        }

        /* 初始化 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: "Ubuntu", "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: var(--fg);
            background-color: var(--bg);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        button, input {
            font: inherit;
            color: inherit;
        }

        ::selection {
            background-color: var(--sel-tint);
        }

        /* ==========================================================
           page：整页骨架
           Dock 浮在壁纸上，所以主区占满整个宽度
           ========================================================== */
        .page {
            display: grid;
            grid-template-rows: 32px 1fr;
            grid-template-columns: 1fr;
            height: 100vh;
        }

        /* ==========================================================
           bar：顶栏
           ========================================================== */
        .bar {
            grid-row: 1;
            position: relative;
            display: flex;
            align-items: center;
            height: 32px;
            padding: 0 var(--pad2);
            font-size: 13px;
            font-weight: 500;
            background-color: var(--bar-bg);
            color: var(--bar-fg);
            user-select: none;
            z-index: 40;
        }

        /* 居中区：没开文档显示时间，开了文档显示文章标题 */
        .bar-center {
            position: absolute;
            left: 50%;
            max-width: 42%;
            transform: translateX(-50%);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bar-right {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-left: auto;
        }

        .bar-btn {
            padding: 2px 10px;
            border: none;
            border-radius: var(--radius-ctl);
            background: none;
            color: var(--bar-fg);
            cursor: pointer;
            transition: background-color var(--dur) var(--ease);
        }

        .bar-btn:hover {
            background-color: rgba(255, 255, 255, .14);
        }

        .bar-btn:active {
            background-color: rgba(255, 255, 255, .22);
        }

        /* ==========================================================
           dock：左侧竖条
           ========================================================== */
        .dock {
            position: fixed;
            left: 0;
            top: 32px;
            bottom: 0;
            width: 56px;
            display: flex;
            flex-direction: column;
            gap: 2px;                /* $dock_spacing */
            padding: 8px 5px 8px 0;
            background-color: var(--bar-bg);
            overflow: visible;
            z-index: 30;
        }

        .dock-item {
            position: relative;
            display: grid;
            place-items: center;
            width: 46px;
            height: 46px;
            border: none;
            border-radius: var(--radius-item);
            background: none;
            cursor: pointer;
            transition: transform var(--dur) var(--ease), background-color var(--dur) var(--ease);
        }

        .dock-item:hover {
            transform: scale(1.06);
            background-color: rgba(255, 255, 255, .12);
        }

        .dock-item:active {
            transform: scale(.97);
        }

        .dock-item svg {
            width: 28px;
            height: 28px;
        }

        .dock-face {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border-radius: var(--radius-item);
            background-color: rgba(255, 255, 255, .10);
        }

        /* 项目图标是实心块，统一刷白；桌面那个是描线图标，不能跟着刷 */
        .dock-face svg {
            fill: #FFFFFF;
        }

        /* 运行指示条，对应 $dock_remark_color 提亮 */
        .dock-item[data-run=true]::after {
            content: "";
            position: absolute;
            left: 2px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 22px;
            border-radius: 2px;
            background-color: rgba(238, 238, 238, .85);
        }

        .dock-sep {
            height: 1px;
            margin: 6px 8px;
            background-color: rgba(238, 238, 238, .16);
        }

        .dock-tip {
            position: absolute;
            left: calc(100% + 10px);
            top: 50%;
            transform: translateY(-50%) scale(.9);
            padding: 4px 10px;
            border-radius: var(--radius-ctl);
            background-color: var(--bar-bg);
            color: var(--bar-fg);
            font-size: 12.5px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            box-shadow: var(--shadow);
            transition: opacity 120ms var(--ease), transform 120ms var(--ease);
        }

        .dock-item:hover .dock-tip {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }

        /* ==========================================================
           desk：主区（壁纸 + 桌面视图）
           ========================================================== */
        .desk {
            grid-row: 2;
            position: relative;
            overflow: hidden;
        }

        /* 壁纸：Ubuntu 26.04 风格的抽象渐变，占位用，可换真图 */
        .desk-wall {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(78% 62% at 76% 14%, rgba(233, 84, 32, .42), transparent 64%),
                radial-gradient(66% 70% at 14% 88%, rgba(146, 77, 139, .52), transparent 66%),
                radial-gradient(120% 100% at 50% 50%, rgba(44, 0, 30, .55), transparent 70%),
                linear-gradient(158deg, #2B1420 0%, #1D1219 46%, #120C11 100%);
        }

        /* 同心光环，慢慢转，给壁纸一点呼吸 */
        .desk-wall::after {
            content: "";
            position: absolute;
            inset: -20%;
            background: repeating-radial-gradient(circle at 72% 22%,
                transparent 0 58px, rgba(255, 255, 255, .028) 58px 59px);
            animation: drift 42s linear infinite;
        }

        @keyframes drift {
            to { transform: rotate(8deg) scale(1.06); }
        }

        /* 噪点，避免大面积渐变出现色带 */
        .desk-noise {
            position: absolute;
            inset: 0;
            opacity: .5;
            mix-blend-mode: overlay;
            pointer-events: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.32'/></svg>");
        }

        /* 桌面视图：没有文档打开时显示 */
        .desk-view {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 40px 40px 96px;    /* 56(Dock) + 40(与右侧对称)，文字才落在可视区正中 */
            text-align: center;
            transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
        }

        .desk-view.is-hide {
            opacity: 0;
            transform: scale(1.02);
            pointer-events: none;
        }

        .desk-welcome {
            font-size: clamp(30px, 5vw, 52px);
            font-weight: 300;
            line-height: 1.2;
            letter-spacing: -.5px;
            color: #FFFFFF;
            text-shadow: 0 2px 24px rgba(0, 0, 0, .45);
        }

        /* ==========================================================
           win：文档窗口
           ========================================================== */
        .win {
            position: absolute;
            inset: 14px 14px 14px 70px;      /* 左边留出 Dock */
            display: flex;
            flex-direction: column;
            border-radius: var(--radius-win);
            background-color: var(--base);
            box-shadow: var(--shadow);
            overflow: hidden;
            opacity: 0;
            transform: scale(.97) translateY(8px);
            z-index: 20;
            transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
        }

        .win.is-open {
            opacity: 1;
            transform: none;
        }

        /* 最大化：铺满主区，仍然停在 Dock 右侧，不用浏览器全屏 API */
        .win.is-max {
            inset: 0 0 0 56px;
            border-radius: 0;
        }

        .win-head {
            flex: none;
            display: flex;
            align-items: center;
            gap: var(--pad);
            height: 46px;
            padding: 0 10px 0 var(--pad2);
            border-bottom: 1px solid var(--border);
            background-color: var(--head-bg);
            user-select: none;
        }

        .win-body {
            flex: 1;
            display: grid;
            grid-template-columns: 248px 1fr;
            min-height: 0;
        }

        /* ==========================================================
           crumb：标题栏里的面包屑
           ========================================================== */
        .crumb {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
            font-size: 14px;
            font-weight: 500;
        }

        .crumb-prj {
            color: var(--fg-dim);
        }

        .crumb-sep {
            font-weight: 300;
            color: var(--fg-dim);
        }

        .crumb-cur {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ==========================================================
           head-btn：标题栏右侧的窗口按钮
           ========================================================== */
        .head-btns {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .head-btn {
            display: grid;
            place-items: center;
            width: 24px;
            height: 24px;
            border: 1px solid var(--border-alt);
            border-radius: 50%;
            background-color: var(--bg);
            cursor: pointer;
            transition: background-color 140ms var(--ease), border-color 140ms var(--ease);
        }

        .head-btn svg {
            width: 11px;
            height: 11px;
            fill: none;
            stroke: var(--fg-dim);
            stroke-width: 2;
        }

        .head-btn:hover {
            background-color: var(--hover);
        }

        .head-btn-min:hover,
        .head-btn-max:hover {
            background-color: var(--active);
        }

        /* 关闭键悬停变红，Yaru 的破坏性色 */
        .head-btn-close:hover {
            border-color: var(--red);
            background-color: var(--red);
        }

        .head-btn-close:hover svg {
            stroke: #FFFFFF;
        }

        /* ==========================================================
           side：侧边栏
           ========================================================== */
        .side {
            display: flex;
            flex-direction: column;
            min-height: 0;
            border-right: 1px solid var(--border);
            background-color: var(--side-bg);
        }

        .side-foot {
            flex: none;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-top: 1px solid var(--border);
            font-size: 12.5px;
            color: var(--fg-dim);
        }

        /* ==========================================================
           search：侧栏顶部搜索框
           ========================================================== */
        .search {
            flex: none;
            position: relative;
            margin: 10px 10px 6px;
        }

        .search input {
            width: 100%;
            height: 32px;
            padding: 0 10px 0 30px;
            border: 1px solid var(--border);
            border-radius: var(--radius-ctl);
            background-color: var(--base);
            font-size: 13px;
            outline: none;
            transition: border-color 140ms var(--ease), box-shadow 140ms var(--ease);
        }

        /* 聚焦光环 = $focus_border_color */
        .search input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(233, 84, 32, .22);
        }

        .search input::placeholder {
            color: var(--fg-dim);
        }

        .search svg {
            position: absolute;
            left: 9px;
            top: 9px;
            width: 14px;
            height: 14px;
            fill: none;
            stroke: var(--fg-dim);
            stroke-width: 2;
        }

        /* ==========================================================
           nav：项目导航列表
           ========================================================== */
        .nav {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px 14px;
        }

        .nav::-webkit-scrollbar {
            width: 9px;
        }

        .nav::-webkit-scrollbar-thumb {
            border: 3px solid transparent;
            border-radius: 5px;
            background-color: var(--border-alt);
            background-clip: content-box;
        }

        .nav-empty {
            padding: 24px 12px;
            font-size: 13px;
            color: var(--fg-dim);
        }

        .nav-group {
            padding: 14px 8px 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .7px;
            text-transform: uppercase;
            color: var(--fg-dim);
        }

        .nav-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-bottom: 1px;
            padding: 6px 8px;
            border: none;
            border-radius: var(--radius-item);
            background: none;
            text-align: left;
            cursor: pointer;
            transition: background-color 140ms var(--ease);
        }

        .nav-item:hover {
            background-color: var(--hover);
        }

        /* 选中态：Yaru 是整条铺满强调色 */
        .nav-item.is-sel {
            background-color: var(--accent);
            color: #FFFFFF;
        }

        .nav-item.is-sel .nav-sub {
            color: rgba(255, 255, 255, .78);
        }

        .nav-item.is-sel .tile {
            background-color: rgba(255, 255, 255, .24);
        }

        .nav-item.is-sel .tile svg {
            fill: #FFFFFF;
        }

        .nav-item:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(233, 84, 32, .4);
        }

        .nav-item mark {
            border-radius: 2px;
            background-color: rgba(249, 155, 17, .45);
            color: inherit;
        }

        .nav-txt {
            flex: 1;
            min-width: 0;
        }

        .nav-name {
            display: block;
            font-size: 13.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-sub {
            display: block;
            font-size: 11.5px;
            color: var(--fg-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 26.04 的彩色文件夹：强调色铺满整个图标块 */
        .tile {
            flex: none;
            display: grid;
            place-items: center;
            width: 26px;
            height: 26px;
            border-radius: 7px;
            background-color: var(--sel-tint);
        }

        .tile svg {
            width: 15px;
            height: 15px;
            fill: var(--accent);
            stroke: none;
        }

        /* ==========================================================
           toggle：浅深色切换
           ========================================================== */
        .toggle {
            display: flex;
            margin-left: auto;
            padding: 2px;
            border: 1px solid var(--border);
            border-radius: 100px;
            background-color: var(--bg);
        }

        .toggle-btn {
            padding: 3px 9px;
            border: none;
            border-radius: 100px;
            background: none;
            font-size: 11.5px;
            color: var(--fg-dim);
            cursor: pointer;
            transition: background-color 140ms var(--ease), color 140ms var(--ease);
        }

        .toggle-btn.is-on {
            background-color: var(--accent);
            color: #FFFFFF;
        }

        /* ==========================================================
           doc：正文
           ========================================================== */
        .doc-pane {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 200px;
            min-height: 0;
            background-color: var(--base);
        }

        .doc {
            min-width: 0;
            padding: 34px 44px 90px;
            overflow-y: auto;
        }

        .doc::-webkit-scrollbar {
            width: 11px;
        }

        .doc::-webkit-scrollbar-thumb {
            border: 3px solid transparent;
            border-radius: 6px;
            background-color: var(--border-alt);
            background-clip: content-box;
        }

        .doc-body {
            max-width: 760px;
        }

        .doc-body h1 {
            margin-bottom: 6px;
            font-size: 27px;
            font-weight: 300;
            line-height: 1.35;
            letter-spacing: -.4px;
        }

        .doc-body h2 {
            margin: 34px 0 12px;
            padding-bottom: 7px;
            border-bottom: 1px solid var(--border);
            font-size: 19px;
            font-weight: 500;
            scroll-margin-top: 20px;
        }

        .doc-body h3 {
            margin: 22px 0 8px;
            font-size: 15.5px;
            font-weight: 500;
        }

        .doc-body p {
            margin: 0 0 13px;
        }

        .doc-body ul,
        .doc-body ol {
            margin: 0 0 14px;
            padding-left: 22px;
        }

        .doc-body li {
            margin-bottom: 6px;
        }

        .doc-body a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid rgba(233, 84, 32, .4);
        }

        .doc-body a:hover {
            border-bottom-color: var(--accent);
        }

        .doc-body strong {
            font-weight: 700;
        }

        .doc-body code {
            padding: 2px 5px;
            border-radius: 4px;
            background-color: var(--code-bg);
            font-family: "Ubuntu Mono", ui-monospace, monospace;
            font-size: 12.5px;
            color: var(--code-fg);
        }

        .doc-body table {
            width: 100%;
            margin: 0 0 18px;
            border-collapse: collapse;
            font-size: 13.5px;
        }

        .doc-body th {
            padding: 8px 12px;
            border: 1px solid var(--border);
            background-color: var(--bg);
            font-weight: 500;
            text-align: left;
        }

        .doc-body td {
            padding: 8px 12px;
            border: 1px solid var(--border);
            vertical-align: top;
        }

        .doc-body tr:nth-child(even) td {
            background-color: rgba(0, 0, 0, .018);
        }

        html[data-theme=dark] .doc-body tr:nth-child(even) td {
            background-color: rgba(255, 255, 255, .022);
        }

        /* 文档里的小件 */
        .lede {
            margin-bottom: 22px;
            font-size: 15.5px;
            line-height: 1.6;
            color: var(--fg-dim);
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin: 0 0 22px;
        }

        .chip {
            padding: 3px 10px;
            border: 1px solid var(--border);
            border-radius: 100px;
            background-color: var(--bg);
            font-size: 11.5px;
            font-weight: 500;
            color: var(--fg-dim);
        }

        .chip-hot {
            border-color: transparent;
            background-color: var(--sel-tint);
            color: var(--accent);
        }

        html[data-theme=dark] .chip-hot {
            color: #F5A983;
        }

        .callout {
            margin: 0 0 18px;
            padding: 13px 16px;
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius-ctl);
            background-color: var(--bg);
        }

        .callout b {

                        title: "自瞄识别方法研究与测试",
                        html: `
<h1>基于 YOLO26n 端到端检测的单一目标自瞄识别方法研究与测试</h1>
<p class="lede">检测目标实物为 Robocon 吉祥物周边毛绒玩偶（仅作为单一目标载体，本项目属 RM 备赛过程中的感知链路技术验证）。</p>
<div class="chips"><span class="chip chip-hot">Robomaster备赛</span><span class="chip">YOLO26n</span><span class="chip">自瞄识别</span></div>
<!-- <div class="callout"><b>交付</b><code>D:\\SystemApps\\desk\\figure_doll\\MeUlt_Do_c</code>（点编译即运行）。</div> -->

<h2>1 任务与范围</h2>
<p>输入摄像头一帧图像，输出目标玩偶的单类别边界框与置信度，供自瞄链路计算像素偏心。</p>
<p><strong>已实现：感知层 + C++ 实时推理 + 跨语言一致性校验。未实现：云台闭环、弹道解算、相机标定、多目标跟踪。</strong> 本报告全部指标均指检测器本身。</p>

<h2>2 技术选型</h2>
<p>对比传统颜色/轮廓、模板匹配、HOG+SVM、两阶段 Faster R-CNN、DETR 类与单阶段 YOLO 谱系后选定 <strong>YOLO26n</strong>：单阶段延迟可控、nano 档适合纯 CPU、端到端头简化部署、导出生态完整。排除传统方法的原因是目标与背景同色系，颜色阈值无法区分三维玩偶与二维印刷图案。</p>

<h2>3 数据</h2>
<p>785 张 = <strong>411 正 + 374 负</strong>，切分 train 630 / val 155。素材为 8 个手持视频与照片来源。</p>
<ul>
    <li><strong>切分</strong>：每来源按帧号排序后每 5 帧取 1 张进 val，不随机分，避免相邻帧泄漏，并保证每个场景在两侧都有代表。校验：重叠 0。</li>
    <li><strong>负样本</strong>：老场景用 HSV 粉色掩码均值 &lt; 0.35 筛，正样本该指标最小 0.62，两分布不重叠，故"画面无目标"可证。新场景与手部素材按拍摄事实取值。</li>
    <li>411 个人工标注框校验：0 缺图、0 字段错、0 越界、0 出框。</li>
</ul>

<h2>4 训练与部署</h2>
<p>以官方发布的 <code>yolo26n.pt</code> 权重做初始化（用 YOLO 的正常起点，官方那份权重本身是在 COCO 数据集上训出来的）。<strong>本项目的训练数据不含任何 COCO 图像，训练使用的 785 张图像均为自己采样。</strong> 单类，200 epoch / imgsz 640 / batch 32 / seed 0，云端 RTX 4090 耗时 <strong>364 秒</strong>，最佳 epoch 190。</p>
<p>导出 <code>figure.onnx</code>（9.88 MB，md5 <code>d51349720205</code>，<code>nms=True</code>，opset 18）：输入 <code>[1,3,640,640]</code> float32 0~1 RGB、letterbox pad 114；输出 <code>[1,300,6]</code>，<strong>坐标在 letterbox 空间而非原图像素</strong>。实测 <code>nms=False</code> 时形状相同但同一目标吐 2 个重复框，会带偏瞄准，故部署固定带 nms，C++ 不做二次 NMS。</p>
<p>C++ 562 行（OpenCV + ONNX Runtime CPU，<code>/MT</code> <code>/utf-8</code> <code>NOMINMAX</code>），构建时自动探测依赖路径。</p>

<h2>5 结果</h2>
<table>
    <tr><th>项</th><th>值</th></tr>
    <tr><td>官方 val</td><td>P 0.999 / R 0.988 / <strong>mAP@0.5 0.985</strong> / mAP@0.5:0.95 0.863</td></tr>
    <tr><td>自算验收（conf 0.25, IoU 0.5）</td><td>TP 79 / <strong>FP 0</strong> / FN 1</td></tr>
    <tr><td>75 张多来源负样本误检</td><td><strong>0</strong>（手-only 20 / 手含小熊 20 / 老场景 19 / 新场景 16）</td></tr>
    <tr><td>CPU 推理</td><td>p50 <strong>16.7 ms</strong> ≈ 60 FPS；摄像头端到端 16.8 FPS（瓶颈是取帧）</td></tr>
    <tr><td>C++ vs Python</td><td>79 框逐框对账，框数不一致 0 张，最大偏差 2.14 px，无系统性偏移</td></tr>
</table>
<p><strong>负样本消融（本项目最有价值的实验）</strong>：同一批 35 张新+老场景负样本上，训练时用 0 张负样本→新场景误检 2 次（conf 0.80/0.82）；<strong>只补 90 张老场景负样本→新场景误检涨到 5 次，比不加更差</strong>；补 84 张新场景负样本→0 次。误检 conf 高到 0.80，调阈值压不住，只能靠数据。</p>
<p><strong>手部 A/B</strong>：加入 200 张"有手无玩偶"负样本后，手-only 40 张误检由 1 降为 0。</p>
<p><strong>留一视频交叉验证</strong>：整段视频拿走当 val，最差 mAP@0.5:0.95 0.625、召回 0.854；三段视频仍是同一房间，故<strong>换环境的真实表现一定更差</strong>。</p>

<h2>6 关键结论与教训</h2>
<ol>
    <li><strong>真正的杠杆在数据侧不在模型侧。</strong> 分辨率扫描（640/1024 差 0.002）、加算力、调超参全部没有改变任何结论；唯一改变能力边界的是负样本是否覆盖目标环境。</li>
    <li><strong>数据判据的盲区会被原样复制成模型的盲区，且不报错。</strong> 肤色落在粉色 HSV 区间内，导致最初 174 张负样本系统性排除了所有带手画面——这就是"手被认成玩偶"的根因（叠加因素：正样本框把手一起框了进去）。</li>
    <li><strong>两条被推翻的弯路（已作废，不属于最终方法）</strong>：为定位"手"，曾试图用间接指标代替看图——一是借用官方预训练权重自带的通用 80 类头去取 person 框，结果它大量地把玩偶本体认成了人（与玩偶真值框中位 IoU 0.634），根本分离不出手；二是改用 YCrCb 肤色占比，在负样本上中位 21%，量到的其实是木地板和地毯。教训：<strong>不要用未经验证相关性的代理指标当证据</strong>，有效证据只有直接看图。</li>
    <li><strong>主指标会误导决策</strong>：mAP@0.5 0.985 与"换环境 0 统计证据"完全并存。分来源误检和交叉验证才是支撑结论的数字。</li>
    <li>工程陷阱：<code>CAP_PROP_FRAME_COUNT</code> 声明 29 帧实际可解码 2531 帧，静默少抽整批数据；首帧 455 ms 预热曾导致"CPU 只有 2.6 FPS"的错误结论。</li>
</ol>

<h2>7 局限</h2>
<p>正样本全部来自同一张桌子，<strong>新场景正样本为 0，换环境无统计证据</strong>（唯一正面个案 n=1，conf 0.943）。框偏大（mAP@0.5 与 @0.5:0.95 差 0.122 即此问题），框中心不宜直接作瞄准点。多目标、遮挡、运动模糊未评估。仅 <code>CPUExecutionProvider</code>，需更快可换 DirectML/OpenVINO 而不改模型。训练所用 ultralytics 为 AGPL-3.0，公开分发需先定许可证。</p>

                    }
                ]
            }
        ];

            elWin.classList.add('is-open');
            elWin.inert = false;                 /* 开窗后才允许 Tab 进窗口内的控件 */
            elDeskView.classList.add('is-hide');
            elDoc.scrollTop = 0;

            /* 顶栏居中换成文章标题，时钟先停 */
            stopClock();
            elBarCenter.textContent = d.title;

            /* 窄屏点完一条就把抽屉收起来，否则侧栏一直挡着正文 */
            if (mqNarrow.matches) {
                elSide.classList.remove('is-show');
            }

            buildNav();
            buildDock();
            buildToc();

            store.set('last', { prj: p.id, doc: d.id });
        }

        function closeWin() {
            cur.prj = null;
            cur.doc = null;

            elWin.classList.remove('is-open');
            elWin.classList.remove('is-max');
            elWin.inert = true;
            elDeskView.classList.remove('is-hide');

            /* 回到桌面，顶栏居中恢复显示时间 */
            startClock();

            buildNav();
            buildDock();

            store.set('last', null);
        }

        /* ==========================================================
           7) 右侧目录
           ========================================================== */
        function buildToc() {
            /* 先释放上一个观察器 */
            if (tocObserver) {
                tocObserver.disconnect();
                tocObserver = null;
            }

            var hs = Array.prototype.slice.call(elDocBody.querySelectorAll('h2'));

            if (hs.length === 0) {
                elToc.innerHTML = "";
                return;
            }

            var html = '<div class="toc-title">目录</div>';
            hs.forEach(function (h, i) {
                h.id = 'sec-' + i;
                html += '<a href="#sec-' + i + '">' + esc(h.textContent) + '</a>';
            });
            elToc.innerHTML = html;

            var links = Array.prototype.slice.call(elToc.querySelectorAll('a'));

            /* 点目录只滚正文区，不要让浏览器动整个页面 */
            links.forEach(function (a) {
                a.onclick = function (e) {
                    e.preventDefault();
                    var target = document.getElementById(a.getAttribute('href').slice(1));
                    elDoc.scrollTo({ top: target.offsetTop - 14, behavior: 'smooth' });
                };
            });

            /* 滚到哪一节就高亮哪一条 */
            tocObserver = new IntersectionObserver(function (entries) {
                entries.forEach(function (en) {
                    if (!en.isIntersecting) {
                        return;
                    }
                    links.forEach(function (l) {
                        l.classList.toggle('is-on', l.getAttribute('href') === '#' + en.target.id);
                    });
                });
            }, { root: elDoc, rootMargin: '-10px 0px -75% 0px' });

            hs.forEach(function (h) {
                tocObserver.observe(h);
            });
        }

        /* ==========================================================
           8) 主题
           ========================================================== */
        function setTheme(t) {
            document.documentElement.dataset.theme = t;

            var btns = document.querySelectorAll('[data-set-theme]');
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.toggle('is-on', btns[i].dataset.setTheme === t);
            }

            store.set('theme', t);
        }

        /* ==========================================================
           9) 顶栏居中内容
           桌面态显示时间，开着文档就换成文章标题并停掉时钟
           ========================================================== */
        var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

        var clockId = null;

        function pad2(n) {
            return String(n).padStart(2, '0');
        }

        function tickClock() {
            var n = new Date();
            elBarCenter.textContent = (n.getMonth() + 1) + '月' + n.getDate() + '日 '
                + WD[n.getDay()] + ' ' + pad2(n.getHours()) + ':' + pad2(n.getMinutes());
        }

        function startClock() {
            /* 先清掉旧的，防止 closeWin 被重复调用时叠多个定时器 */
            if (clockId) {
                clearInterval(clockId);
            }
            tickClock();
            clockId = setInterval(tickClock, 1000);
        }

        function stopClock() {
            if (clockId) {
                clearInterval(clockId);
                clockId = null;
            }
        }

        /* ==========================================================
           10) 交互绑定
           ========================================================== */
        /* 搜索 */
        elSearch.addEventListener('input', function () {
            filter = elSearch.value.trim();
            buildNav();
        });

        /* 主题切换 */
        var toggleBtns = document.querySelectorAll('[data-set-theme]');
        for (var t = 0; t < toggleBtns.length; t++) {
            toggleBtns[t].onclick = function () {
                setTheme(this.dataset.setTheme);
            };
        }

        /* 窗口按钮：关闭和最小化都回桌面，最大化只切状态类 */
        document.getElementById('head-btn-close').onclick = closeWin;
        document.getElementById('head-btn-min').onclick = closeWin;
        document.getElementById('head-btn-max').onclick = function () {
            elWin.classList.toggle('is-max');
        };

        /* 键盘：↑↓ 在侧栏里走，Esc 关窗，/ 聚焦搜索 */
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeWin();
                return;
            }

            /* 窗口没开时搜索框是 inert 的，聚焦不了，别抢这个键 */
            if (e.key === '/' && elWin.classList.contains('is-open') && document.activeElement !== elSearch) {
                e.preventDefault();
                elSearch.focus();
                return;
            }

            if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') {
                return;
            }

            var items = Array.prototype.slice.call(elNav.querySelectorAll('.nav-item'));
            if (items.length === 0) {
                return;
            }

            e.preventDefault();

            var i = items.findIndex(function (el) {
                return el.dataset.prj === cur.prj && el.dataset.doc === cur.doc;
            });

            if (e.key === 'ArrowDown') {
                i = i < 0 ? 0 : Math.min(items.length - 1, i + 1);
            } else {
                i = Math.max(0, i - 1);
            }

            openDoc(items[i].dataset.prj, items[i].dataset.doc);

            /* openDoc 会重建列表，取重建后的那一项，取不到就不聚焦 */
            var focusTarget = elNav.querySelectorAll('.nav-item')[i];
            if (focusTarget) {
                focusTarget.focus();
            }
        });

        /* 窄屏才显示顶栏的汉堡键 */
        var elBarBtnSide = document.getElementById('bar-btn-side');

        function syncSideBtn() {
            elBarBtnSide.style.display = mqNarrow.matches ? 'block' : 'none';
        }

        mqNarrow.addEventListener('change', syncSideBtn);

        elBarBtnSide.onclick = function () {
            elSide.classList.toggle('is-show');
        };

        /* ==========================================================
           11) 启动
           ========================================================== */
        setTheme(store.get('theme', 'light'));
        syncSideBtn();
        buildDock();
        buildNav();

        /* 先按桌面态起时钟，若下面要恢复上次打开的文档，它会被停掉 */
        startClock();

        /* 上次看的是哪篇，接着打开 */
        var last = store.get('last', null);
        if (last) {
            openDoc(last.prj, last.doc);
        }
    </script>
</body>
</html>
